name: Demo checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['prototype/**', 'src/**', 'scripts/**', 'requirements-*.txt', 'data/catalog/**', '.github/workflows/windows-demo.yml']
  pull_request:
    paths: ['prototype/**', 'src/**', 'scripts/**', 'requirements-*.txt', 'data/catalog/**', '.github/workflows/windows-demo.yml']
permissions:
  contents: read
jobs:
  portable-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tesseract (Windows)
        if: runner.os == 'Windows'
        run: choco install tesseract --yes --no-progress
      - name: Install Tesseract (Mac)
        if: runner.os == 'macOS'
        run: brew install tesseract
      - name: Set up shared CPU demo and check offline photos
        run: python scripts/setup_demo.py
      - name: Test Windows runtime and classification routing
        if: runner.os == 'Windows'
        run: .venv\Scripts\python.exe -m pytest tests/test_catalog.py tests/test_collection_export.py tests/test_reclassify.py tests/test_scene_ocr.py tests/test_windows_demo.py -q
      - name: Test Mac runtime and classification routing
        if: runner.os == 'macOS'
        run: .venv/bin/python -m pytest tests/test_catalog.py tests/test_collection_export.py tests/test_reclassify.py tests/test_scene_ocr.py tests/test_windows_demo.py -q
      - name: Upload actual platform report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-check-${{ runner.os }}
          path: output/windows-demo/*.json
          if-no-files-found: ignore
