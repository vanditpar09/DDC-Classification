name: Build demo packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: brew install tesseract
      - run: python scripts/setup_demo.py
      - run: .venv/bin/python scripts/build_demo_packages.py --platform both
      - run: .venv/bin/python scripts/check_windows_bundle.py --platform windows
      - run: .venv/bin/python scripts/check_windows_bundle.py --platform macos
      - uses: actions/upload-artifact@v4
        with:
          name: DDC-demo-packages
          path: output/releases/*
          compression-level: 0
          if-no-files-found: error
